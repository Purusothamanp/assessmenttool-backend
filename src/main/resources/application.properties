# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# MySQL Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assessment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration (Default Spring Boot limit is 1MB, increased to 50MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tomcat connection size to prevent connection reset on upload limits
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000,https://assessment-tool-3izl.onrender.com,https://*.onrender.com,https://*.railway.app,https://*.vercel.app}
